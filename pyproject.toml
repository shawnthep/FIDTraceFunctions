[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my_package_name_on_pip"   # The name used in: pip install
version = "0.1.0"
authors = [
    { name="Your Name", email="your.email@example.com" }
]
description = "A short description of your Python package"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # List packages your code needs to run, for example:
    # "requests>=2.28.0",
    # "numpy>=1.22.0",
]

[tool.setuptools.packages.find]
where = ["src"]  # Tells setuptools to look inside the "src" folder
