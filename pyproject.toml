[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "FIDTraceFunctions"
version = "0.1.0"
authors = [
    { name = "Shawn P", email = "your.email@example.com" }
]
description = "A short description of your Python package"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

# This tells setuptools to look inside 'src' and treat it as the package base
[tool.setuptools.packages.find]
where = ["src"]