[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "FIDTraceFunctions"
version = "0.1.0"
authors = [
    { name="Your Name", email="your.email@example.com" }
]
description = "A short description of your Python package"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT" # Using the modern SPDX field fixes the warning you saw earlier!
dependencies = [
    "numpy",  # Add any dependencies your code actually needs here
]

# --- NEW CONFIGURATION FOR FLAT LAYOUT ---
[tool.setuptools]
py-modules = ["FIDTraceFunctions"] # Tells Python to look for a file named FIDTraceFunctions.py
